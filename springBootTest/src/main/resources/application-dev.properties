server.port=8081

# ==========================================================================
# 数据源：本地 MySQL 8.0
#   数据库名 blockcraft（建库脚本见项目 sql/blockcraft_init.sql）
# ==========================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/blockcraft?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=123456

# HikariCP 连接池
spring.datasource.hikari.pool-name=BlockCraftHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================================================
# MyBatis-Plus
# ==========================================================================
# 实体所在包，写 XML 时 resultType 可以直接写类名
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
# mapper xml 位置（当前全部使用 BaseMapper 无 XML，留着方便后续扩展）
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
# 开启驼峰转换：last_login_time -> lastLoginTime
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 打印执行的 SQL（开发期很方便，上线请关掉）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 全局策略
mybatis-plus.global-config.banner=false
mybatis-plus.global-config.db-config.id-type=auto
# 表名统一由实体上的 @TableName("t_user") 指定，这里不配 table-prefix，
# 避免出现 t_t_user 这种「前缀叠加」的坑
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
