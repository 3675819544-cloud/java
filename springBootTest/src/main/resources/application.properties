# ==========================================================================
# 主配置：只放「与环境无关」的公共项，具体环境参数见 application-{profile}.properties
# ==========================================================================
spring.application.name=springBootTest

# 默认启用 dev 环境（数据库连接在 application-dev.properties）
spring.profiles.active=dev

# ---------------------------- 日志 ----------------------------
logging.level.root=info
logging.level.com.fenglin.springboottest=debug
# 控制台不打印 MyBatis-Plus 的 SQL 时可以把这个调成 warn
logging.level.com.fenglin.springboottest.mapper=debug
logging.file.name=log/blockcraft.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40}.%M %L - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40}.%M %L - %msg%n

# ---------------------------- 业务自定义配置 ----------------------------
# JWT 签名密钥（生产环境请改成随机长字符串，不要提交到公开仓库）
blockcraft.jwt.secret=blockcraft-login-secret-key-please-change-me-2026
# token 有效期：秒（7 天）
blockcraft.jwt.expire-seconds=604800
# 图片验证码有效期：秒（5 分钟）
blockcraft.captcha.expire-seconds=300
