<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6366F1" />
  <title>登录 · Nebula</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ============================================================
       整体布局：桌面端左右分栏（品牌区 | 表单区）
       移动端堆叠为单列（表单在上，品牌区在下）
       ============================================================ -->
  <main class="auth">

    <!-- ---------------- 左侧：品牌展示区 ---------------- -->
    <section class="brand-panel">
      <div class="brand-inner">
        <!-- Logo -->
        <a class="brand-logo" href="#" aria-label="Nebula 首页">
          <span class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M16 3.5 27.3 10v12L16 28.5 4.7 22V10L16 3.5Z"
                    stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <circle cx="16" cy="16" r="3.6" fill="currentColor"/>
            </svg>
          </span>
          <span class="logo-text">Nebula</span>
        </a>

        <!-- 品牌标语 -->
        <h1 class="brand-headline">
          让每一次协作<br />都轻盈而专注
        </h1>
        <p class="brand-sub">
          一个为现代团队打造的云端工作空间 —— 简洁、快速、值得信赖。
        </p>

        <!-- 装饰性光斑（纯视觉，不参与交互） -->
        <span class="glow glow-1" aria-hidden="true"></span>
        <span class="glow glow-2" aria-hidden="true"></span>
        <span class="glow glow-3" aria-hidden="true"></span>
      </div>

      <p class="brand-foot">© 2026 Nebula Inc. 保留所有权利</p>
    </section>

    <!-- ---------------- 右侧：登录表单区 ---------------- -->
    <section class="form-panel">
      <div class="login-card">

        <!-- 卡片头部 -->
        <header class="card-head">
          <h2 class="card-title">欢迎回来</h2>
          <p class="card-desc">请登录以继续访问你的工作空间</p>
        </header>

        <!-- 登录表单（novalidate：改用自定义校验） -->
        <form id="loginForm" class="login-form" novalidate>

          <!-- 邮箱 / 用户名 -->
          <div class="field">
            <label class="field-label" for="email">邮箱或用户名</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="5" width="18" height="14" rx="2.5"/>
                  <path d="m3.5 7 8.5 6 8.5-6"/>
                </svg>
              </span>
              <input
                id="email"
                name="email"
                type="text"
                class="input"
                placeholder="you@example.com"
                autocomplete="username"
                aria-describedby="emailError"
              />
            </div>
            <p class="field-error" id="emailError" role="alert"></p>
          </div>

          <!-- 密码（含显示/隐藏切换） -->
          <div class="field">
            <div class="field-row">
              <label class="field-label" for="password">密码</label>
              <a class="link-forgot" href="#">忘记密码？</a>
            </div>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="4" y="10.5" width="16" height="10" rx="2.5"/>
                  <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
                </svg>
              </span>
              <input
                id="password"
                name="password"
                type="password"
                class="input"
                placeholder="请输入密码"
                autocomplete="current-password"
                aria-describedby="passwordError"
              />
              <button type="button" class="btn-eye" id="togglePassword" aria-label="显示密码">
                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1.8 12S5.8 5 12 5s10.2 7 10.2 7-4 7-10.2 7S1.8 12 1.8 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 5.2A10.4 10.4 0 0 1 12 5c6.2 0 10.2 7 10.2 7a18.6 18.6 0 0 1-3.3 4.2M6.4 6.7A18.7 18.7 0 0 0 1.8 12s4 7 10.2 7a10 10 0 0 0 4-.8"/>
                  <path d="M10 10a3 3 0 0 0 4 4"/>
                  <path d="m2.8 2.8 18.4 18.4"/>
                </svg>
              </button>
            </div>
            <p class="field-error" id="passwordError" role="alert"></p>
          </div>

          <!-- 记住我 -->
          <label class="checkbox-row" for="remember">
            <input type="checkbox" id="remember" name="remember" class="checkbox" />
            <span class="checkbox-box" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m5 12.5 4.6 4.6L19 7.6"/>
              </svg>
            </span>
            <span class="checkbox-text">记住我，保持登录状态</span>
          </label>

          <!-- 主按钮 -->
          <button type="submit" class="btn-primary" id="submitBtn">
            <span class="btn-label">登 录</span>
            <span class="btn-spinner" aria-hidden="true"></span>
          </button>
        </form>

        <!-- 分隔线 -->
        <div class="divider"><span>或</span></div>

        <!-- 第三方登录 -->
        <div class="socials">
          <button type="button" class="social-btn" aria-label="使用 Google 登录">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.5-.24-2.18H12v4.14h6.55c-.13 1.1-.85 2.75-2.45 3.86l-.02.15 3.56 2.75.25.02c2.26-2.09 3.56-5.16 3.56-8.74Z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.9l-3.78-2.93c-1.01.7-2.37 1.2-4.16 1.2-3.18 0-5.87-2.09-6.83-4.98l-.14.01-3.7 2.86-.05.13C3.25 21.3 7.3 24 12 24Z"/>
              <path fill="#FBBC05" d="M5.17 14.39a7.4 7.4 0 0 1-.4-2.39c0-.83.15-1.64.39-2.39l-.01-.16L1.4 6.55l-.12.06A11.96 11.96 0 0 0 0 12c0 1.94.47 3.76 1.28 5.39l3.89-3Z"/>
              <path fill="#EA4335" d="M12 4.63c2.25 0 3.77.97 4.63 1.78l3.38-3.3C17.94 1.19 15.24 0 12 0 7.3 0 3.25 2.7 1.28 6.61l3.88 3.01C6.13 6.73 8.82 4.63 12 4.63Z"/>
            </svg>
          </button>

          <button type="button" class="social-btn" aria-label="使用 GitHub 登录">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 .5A11.5 11.5 0 0 0 .5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2c-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37 1.93.1-.96.4-1.62.73-1.99-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.03 11.03 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.74.8 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.26 5.68.42.36.78 1.06.78 2.14v3.17c0 .31.21.68.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
            </svg>
          </button>

          <button type="button" class="social-btn" aria-label="使用微信登录">
            <svg viewBox="0 0 24 24" fill="#07C160" aria-hidden="true">
              <path d="M8.7 2.6C4.5 2.6 1.1 5.5 1.1 9c0 2 1.1 3.8 2.9 5l-.8 2.3 2.6-1.3c.9.3 1.9.4 2.9.4h.4a5.5 5.5 0 0 1-.2-1.4c0-3.4 3.3-6.1 7.3-6.1h.6C16.9 5.1 13.1 2.6 8.7 2.6Z"/>
              <circle cx="6.2" cy="7.6" r="1.05" fill="#fff"/>
              <circle cx="11.2" cy="7.6" r="1.05" fill="#fff"/>
              <path d="M23 14.6c0-2.9-3-5.3-6.6-5.3s-6.6 2.4-6.6 5.3 3 5.3 6.6 5.3c.8 0 1.5-.1 2.2-.3l2.1 1.1-.6-1.8c1.7-1 2.9-2.6 2.9-4.3Z"/>
              <circle cx="14.3" cy="13.5" r=".85" fill="#fff"/>
              <circle cx="18.5" cy="13.5" r=".85" fill="#fff"/>
            </svg>
          </button>
        </div>

        <!-- 注册引导 -->
        <p class="card-foot">
          还没有账号？<a class="link-strong" href="#">立即注册</a>
        </p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
